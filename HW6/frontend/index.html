<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker 微服務架構展示儀表板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #38bdf8;
            --success: #22c55e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        h1 { margin: 0 0 8px 0; font-size: 26px; }
        p.subtitle { margin: 0; color: var(--text-sub); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }
        .card h3 { margin: 0 0 10px 0; font-size: 16px; color: var(--primary); }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            background-color: var(--primary);
            border: none;
            color: #0f172a;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th { background-color: #273549; color: var(--text-sub); font-size: 14px; }
        tr:last-child td { border-bottom: none; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Docker Microservices System Dashboard</h1>
        <p class="subtitle">架構：Nginx (Reverse Proxy) ➔ Python FastAPI (Backend) ➔ PostgreSQL (Database)</p>
    </header>

    <div class="grid">
        <div class="card">
            <h3>Nginx Web Proxy</h3>
            <p>Port: <code>80:80</code></p>
            <span class="status-badge">Active & Serving</span>
        </div>
        <div class="card">
            <h3>Backend API</h3>
            <p>Container ID: <code id="backend-host">載入中...</code></p>
            <span class="status-badge" id="backend-status">檢查中...</span>
        </div>
        <div class="card">
            <h3>PostgreSQL</h3>
            <p>Connection: <code id="db-status">檢查中...</code></p>
            <span class="status-badge" id="db-badge">Active</span>
        </div>
    </div>

    <div class="card" style="margin-bottom: 25px;">
        <h3>資料持久化驗證 (PostgreSQL 讀寫測試)</h3>
        <div class="form-row">
            <input type="text" id="log-input" placeholder="輸入一筆資料寫入資料庫...">
            <button onclick="submitLog()">寫入資料庫</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th style="width: 80px;">ID</th>
                    <th>訊息內容</th>
                    <th style="width: 220px;">建立時間</th>
                </tr>
            </thead>
            <tbody id="log-table-body">
                <tr><td colspan="3" style="text-align: center; color: var(--text-sub);">載入中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function fetchHealth() {
        try {
            const res = await fetch('/api/health');
            const data = await res.json();
            document.getElementById('backend-host').textContent = data.container_hostname;
            document.getElementById('backend-status').textContent = data.status === 'healthy' ? 'Healthy' : 'Degraded';
            document.getElementById('db-status').textContent = data.database_status;
        } catch (err) {
            document.getElementById('backend-status').textContent = 'Offline';
            document.getElementById('db-status').textContent = 'Error';
        }
    }

    async function fetchLogs() {
        try {
            const res = await fetch('/api/logs');
            const result = await res.json();
            const tbody = document.getElementById('log-table-body');
            tbody.innerHTML = '';
            if (result.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">尚無資料</td></tr>';
                return;
            }
            result.data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.message}</td>
                    <td>${new Date(item.created_at).toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            console.error(err);
        }
    }

    async function submitLog() {
        const input = document.getElementById('log-input');
        const text = input.value.trim();
        if (!text) return;
        try {
            await fetch('/api/logs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            input.value = '';
            fetchLogs();
        } catch (err) {
            alert('寫入失敗');
        }
    }

    fetchHealth();
    fetchLogs();
</script>
</body>
</html>
