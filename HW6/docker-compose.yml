version: '3.8'

services:
  # 資料庫微服務
  db:
    image: postgres:16-alpine
    container_name: demo_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: system_demo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d system_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 後端 API 微服務 (Python FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demo_backend
    restart: always
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: system_demo
      DATABASE_USER: admin
      DATABASE_PASSWORD: adminpassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  # Web 伺服器與反向代理微服務 (Nginx)
  nginx:
    image: nginx:1.25-alpine
    container_name: demo_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
